<style>
:root{--bg:#0B0F0D;--s1:#131A16;--line:#26302A;--tx:#EEF3EF;--tx2:#A8B3AC;--g:#2EE06B;--amb:#FFC24B}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
form{width:100%;max-width:360px;background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:28px 22px}

input[type=password]:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 4px rgba(46,224,107,.18)}
label.rm{display:flex;align-items:center;gap:10px;margin:14px 0 18px;font-size:15px;color:var(--tx2)}
label.rm input{width:22px;height:22px;accent-color:var(--g)}

button:disabled{opacity:.6}
#msg{min-height:22px;margin:12px 0 0;font-size:14px;color:var(--amb);text-align:center}

var K='sp26-key';
function u8(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function b64(a){var s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function open(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.iv)},k,u8(D.ct));}).then(function(buf){var h=new TextDecoder().decode(buf);document.open();document.write(h);document.close();});}
function derive(pw){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']).then(function(b){return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:u8(D.salt),iterations:D.it},b,256);}).then(function(bits){return new Uint8Array(bits);});}

else pw.focus();

  go.disabled=true;msg.textContent='확인하는 중…';
  derive(v).then(function(raw){var keep=remember;return open(raw).then(function(){try{if(keep)localStorage.setItem(K,b64(raw));}catch(e){}});})
  .catch(function(){go.disabled=false;msg.textContent='비밀번호가 맞지 않아요.';pw.select();});
});
